[project]
name = "shorts-factory-studio"
version = "0.1.0"
description = "Local-first autonomous animation studio for YouTube Shorts"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
    "edge-tts==7.3.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.14.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

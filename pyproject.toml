[project]
name = "shorts-factory-studio"
version = "0.1.0"
description = "Local-first autonomous animation studio for YouTube Shorts"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.14.3", "mypy==1.18.2"]

[tool.mypy]
python_version = "3.12"
packages = ["packages.core"]
strict = true
# Tests exercise contracts loosely by design; the gate covers the product only.
exclude = ["tests", "apps", "scripts", "e2e"]
# Tolerated pydantic/py tedium is rejected wholesale, not by loosening: no per-error disables
# are allowed below without a written reason in docs/IMPLEMENTATION_ROADMAP.md.

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"
markers = [
    # Real browser, real ffmpeg, seconds per test. Deselect with `-m "not slow"` for the fast loop.
    "slow: drives chrome-headless-shell and ffmpeg end to end",
    # Drives Windows PowerShell SAPI. Must not run concurrently with another serial test: several
    # processes binding the same SAPI COM object make sapi_tts.ps1 fail with NamedParameterNotFound.
    "serial: spawns PowerShell SAPI; must not run concurrently with another serial test",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom
